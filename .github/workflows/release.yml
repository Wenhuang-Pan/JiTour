# 记途 Android 自动发布流水线
# 触发方式：推送 v 开头的 tag（如 v3.1.0）→ 构建 release APK + SHA256 校验值并创建 GitHub Release
# 也支持 Actions 页面手动触发（仅构建并上传 artifact，不创建 Release）
name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布 release APK
    runs-on: ubuntu-latest
    env:
      # WHY: 签名密码仅通过 Secrets 注入环境变量，仓库中不保留任何明文
      JITU_STORE_PASSWORD: ${{ secrets.JITU_STORE_PASSWORD }}
      JITU_KEY_PASSWORD: ${{ secrets.JITU_KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # WHY: 缓存 Gradle 发行版、依赖包与构建缓存，避免每次运行重新下载几百 MB
      # 依赖（省 2-4 分钟）。首次运行写入缓存，后续运行 10-30 秒恢复。
      # org.gradle.caching=true 已在 CI 内存参数中设置，build cache 可跨运行
      # 复用未变化任务（如第三方库处理）的输出，效果接近增量构建
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Flutter 3.41.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      # WHY: keystore 以 base64 形式存放在 GitHub Secrets，构建前解码到本地工程默认路径，
      # 签名密码在 build.gradle.kts 中有默认值，故只需提供 keystore 文件本身
      - name: 解码签名 keystore
        env:
          JITU_KEYSTORE_BASE64: ${{ secrets.JITU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$JITU_KEYSTORE_BASE64" ]; then
            echo "::error::未配置 JITU_KEYSTORE_BASE64 secret，无法构建 release 包"
            exit 1
          fi
          echo "$JITU_KEYSTORE_BASE64" | base64 -d > android/app/jitu.jks

      # WHY: gradle.properties 为本地低内存开发机调优（-Xmx1280m/MaxMetaspaceSize=384m），
      # CI runner（7G 内存）执行 R8+AOT 的 release 构建时 384m Metaspace 不足导致 OOM，
      # 故 CI 单独覆盖内存参数，不影响本地开发机构建
      - name: 调整 CI 构建内存参数
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC
          android.useAndroidX=true
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          kotlin.compiler.execution.strategy=in-process
          EOF

      # WHY: 仅编译 ARM 架构（arm32/arm64），裁掉 x86_64——该架构仅 Android 模拟器
      # 可用，真机全部为 ARM。省 1-2 分钟 Dart AOT 编译与打包时间，APK 减重约 1/3
      - name: 构建 release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64

      - name: 整理产物并生成 SHA256 校验值
        run: |
          mkdir -p artifacts
          # WHY: Gradle 输出的 APK 为中文文件名，复制为纯 ASCII 名称避免 Release 附件编码问题
          cp build/app/outputs/flutter-apk/*.apk "artifacts/jitu-${GITHUB_REF_NAME}-release.apk"
          cd artifacts
          sha256sum "jitu-${GITHUB_REF_NAME}-release.apk" > "jitu-${GITHUB_REF_NAME}-sha256.txt"
          cat "jitu-${GITHUB_REF_NAME}-sha256.txt"

      - name: 上传构建产物（手动触发时可在此下载）
        uses: actions/upload-artifact@v4
        with:
          name: jitu-${{ github.ref_name }}-apk
          path: artifacts/*
          retention-days: 14

      # WHY: 仅 tag 推送时创建正式 Release，手动触发只产出 artifact 便于验证流水线
      - name: 创建 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 记途 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
