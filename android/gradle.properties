# WHY: 开发机 16G 内存常驻 IDE/浏览器后可用约 2-3G，原 -Xmx3G 会导致 JVM native 内存 OOM 崩溃，降至 1.5G 保证可构建
# WHY: v2.4.0 构建时可用内存仅 2.8G，Dart VM 创建工作线程失败(错误22)——系统提交内存不足。
# 降至 1280m 并让 Kotlin 编译器在 Gradle 进程内执行，省掉独立 Kotlin daemon JVM（约 0.7-1G），
# 本项目 Kotlin 代码极少，in-process 编译完全够用
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+UseG1GC
android.useAndroidX=true
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
